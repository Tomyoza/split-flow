name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      # mypy fails with "no files" while src/domain is empty, so skip it until then. Remove this branch once the first file exists
      - name: Mypy (src/domain)
        run: |
          if find src/domain -name '*.py' | grep -q .; then
            uv run mypy --strict src/domain
          else
            echo "src/domain has no Python files yet; skipping mypy"
          fi

      # pytest exits with code 5 when no tests are collected; treat only that as success. Remove `|| ...` once the first test exists
      - name: Pytest
        run: uv run pytest || [ $? -eq 5 ]
